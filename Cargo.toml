[package]
name = "easy-editor"
version = "0.1.0"
edition = "2021"
description = "EasyEditor - a small but genuinely useful code editor built with egui"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "clipboard",
    "links",
] }
egui = "0.37"
egui_extras = "0.37"
syntect = "5.3"
walkdir = "2.5"
alacritty_terminal = "0.26"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rfd = "0.15"
regex = "1"
memchr = "2"
unicode-width = "0.2"

# 依赖库用 O2 编译，自身代码保持快速迭代
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }
